[project]
name = "org-llm"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.12",
    "rich>=13",
    "sqlalchemy>=2",
    "sqlite-vec>=0.1",
    "orgparse>=0.4",
    "ollama>=0.2",
    "numpy>=1.26",
    "dbt-core>=1.8",
    "dbt-sqlite>=1.8",
    "mcp>=1.27.0",
]

[project.scripts]
org-llm = "org_llm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Ship the bundled dbt templates with the wheel so `uv tool install
# org-llm` users can `org-llm dbt init` immediately. The starter project
# lives at org_llm/dbt_templates/ and is copied to ~/.local/share/org-llm/dbt/
# on init for in-place editing.
[tool.hatch.build.targets.wheel]
packages = ["org_llm"]
include = ["org_llm/dbt_templates/**/*.sql",
           "org_llm/dbt_templates/**/*.yml"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"
