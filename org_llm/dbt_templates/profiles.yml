org_llm:
  target: dev
  outputs:
    dev:
      type: sqlite
      threads: 1
      database: "main"
      schema: "main"
      # dbt-sqlite requires schemas_and_paths to attach the DB file at run
      # time. ORG_LLM_DB picks up either the user's environment override
      # or the canonical XDG-data path created by `org-llm init`.
      schemas_and_paths:
        main: "{{ env_var('ORG_LLM_DB', '~/.local/share/org-llm/org-llm.db') }}"
      schema_directory: "{{ env_var('ORG_LLM_DB_DIR', '~/.local/share/org-llm') }}"
