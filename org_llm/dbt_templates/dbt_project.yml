name: org_llm
version: "1.0.0"
profile: org_llm

model-paths: ["models"]
target-path: "target"
clean-targets: ["target"]

models:
  org_llm:
    staging:
      +materialized: view
    marts:
      +materialized: table
      # Event-stream marts are thin projections of the live `history`
      # event log (or `stg_nodes` with `julianday('now')`). Materialized
      # as tables they snapshot at last `dbt build` and silently drift
      # — the data-integrity bug surfaced by the 2026-05-06 Superset
      # tier-1 probe (llm_calls.timestamp 6 days behind history).
      llm_calls:
        +materialized: view
      cli_invocations:
        +materialized: view
      recent_activity:
        +materialized: view
      recent_nodes:
        +materialized: view
