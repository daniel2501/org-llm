- metric_name: llm_calls
  verbose_name: llm_calls
  metric_type: null
  expression: COUNT(*)
  description: Total LLM calls
  d3format: null
  warning_text: null
- metric_name: llm_errors
  verbose_name: llm_errors
  metric_type: null
  expression: SUM(CASE WHEN llm_outcome != 'ok' THEN 1 ELSE 0 END)
  description: Failed LLM calls (outcome != 'ok')
  d3format: null
  warning_text: null
- metric_name: llm_error_rate
  verbose_name: llm_error_rate
  metric_type: null
  expression: AVG(CASE WHEN llm_outcome != 'ok' THEN 1.0 ELSE 0.0 END)
  description: Error rate, 0..1
  d3format: null
  warning_text: null
- metric_name: llm_avg_ms
  verbose_name: llm_avg_ms
  metric_type: null
  expression: AVG(llm_duration_ms)
  description: Mean call duration (ms)
  d3format: null
  warning_text: null
- metric_name: llm_max_ms
  verbose_name: llm_max_ms
  metric_type: null
  expression: MAX(llm_duration_ms)
  description: Slowest call duration (ms)
  d3format: null
  warning_text: null
- metric_name: crew_actions
  verbose_name: crew_actions
  metric_type: null
  expression: COUNT(*)
  description: Manager (crew) audit-log rows
  d3format: null
  warning_text: null
- metric_name: crew_delegations
  verbose_name: crew_delegations
  metric_type: null
  expression: SUM(CASE WHEN (crew_action = 'delegate') THEN 1 ELSE 0 END)
  description: Manager delegations to specialists
  d3format: null
  warning_text: null
- metric_name: crew_failures
  verbose_name: crew_failures
  metric_type: null
  expression: SUM(CASE WHEN crew_outcome != 'ok' THEN 1 ELSE 0 END)
  description: Crew actions whose outcome wasn't 'ok'
  d3format: null
  warning_text: null
- metric_name: agent_fan_out
  verbose_name: agent_fan_out
  metric_type: null
  expression: COUNT(DISTINCT crew_agent_to)
  description: Distinct downstream agents an agent_from has talked to (proxy-vs-manager
    dominance lens)
  d3format: null
  warning_text: null
