table_name: crew_x_llm_command
main_dttm_col: crew_timestamp
description: "org-llm cross-source join: crew \u2194 llm (left)"
default_endpoint: null
offset: 0
cache_timeout: null
schema: null
sql: SELECT llm.model AS model, llm.outcome AS outcome, llm.call_kind AS call_kind,
  llm.command AS command, substr(llm.timestamp, 1, 10) AS llm_day, crew.agent_to AS
  agent_to, crew.agent_from AS agent_from, crew.action AS crew_action, crew.outcome
  AS crew_outcome, substr(crew.timestamp, 1, 10) AS crew_day, crew.timestamp AS crew_timestamp,
  crew.agent_to AS crew_agent_to, crew.agent_from AS crew_agent_from, crew.action
  AS crew_action, crew.outcome AS crew_outcome, llm.timestamp AS llm_timestamp, llm.model
  AS llm_model, llm.outcome AS llm_outcome, llm.call_kind AS llm_call_kind, llm.command
  AS llm_command, llm.duration_ms AS llm_duration_ms FROM crew_log AS crew LEFT JOIN
  llm_calls AS llm ON crew.agent_to = llm.command
params: null
template_params: null
filter_select_enabled: true
fetch_values_predicate: null
extra: null
