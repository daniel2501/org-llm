table_name: llm_x_history_event
main_dttm_col: llm_timestamp
description: "org-llm cross-source join: llm \u2194 history (inner)"
default_endpoint: null
offset: 0
cache_timeout: null
schema: null
sql: SELECT llm.model AS model, llm.outcome AS outcome, llm.call_kind AS call_kind,
  llm.command AS command, substr(llm.timestamp, 1, 10) AS llm_day, history.kind AS
  hist_kind, history.command AS hist_command, substr(history.timestamp, 1, 10) AS
  hist_day, llm.timestamp AS llm_timestamp, llm.model AS llm_model, llm.outcome AS
  llm_outcome, llm.call_kind AS llm_call_kind, llm.command AS llm_command, llm.duration_ms
  AS llm_duration_ms, history.timestamp AS history_timestamp, history.kind AS history_kind,
  history.command AS history_command, history.duration_ms AS history_duration_ms FROM
  llm_calls AS llm INNER JOIN history AS history ON llm.id = history.id AND history.kind
  = 'llm'
