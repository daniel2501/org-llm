table_name: llm_x_sensors_temporal
main_dttm_col: llm_timestamp
description: "org-llm cross-source join: llm \u2194 sensors (time_bucket)"
default_endpoint: null
offset: 0
cache_timeout: null
schema: null
sql: SELECT llm.model AS model, llm.outcome AS outcome, llm.call_kind AS call_kind,
  llm.command AS command, substr(llm.timestamp, 1, 10) AS llm_day, sensors.probe AS
  probe, sensors.status AS probe_status, date(sensors.ts, 'unixepoch') AS sensor_day,
  llm.timestamp AS llm_timestamp, llm.model AS llm_model, llm.outcome AS llm_outcome,
  llm.call_kind AS llm_call_kind, llm.command AS llm_command, llm.duration_ms AS llm_duration_ms,
  sensors.ts AS sensors_ts, sensors.probe AS sensors_probe, sensors.status AS sensors_status
  FROM llm_calls AS llm INNER JOIN sensor_log AS sensors ON substr(llm.timestamp,
  1, 10) = date(sensors.ts, 'unixepoch')
params: null
